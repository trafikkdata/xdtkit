name: R tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Ubuntu, R release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://inla.r-inla-download.org/R/stable

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload

      - name: Run testthat suite
        shell: Rscript {0}
        run: testthat::test_local(stop_on_failure = TRUE)
